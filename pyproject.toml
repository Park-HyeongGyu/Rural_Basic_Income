[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rural-basic-income"
version = "0.4.0"
description = "Research web platform for rural basic income data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bleach>=6.1",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown>=3.7",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "psycopg[binary]>=3.2",
    "pyfixest>=0.60,<0.61",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
rbi = "rural_basic_income.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
